name: ci

on:
    push:
        branches:
            - master
    pull_request_target:

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
            - uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            - run: npm ci
            - run: npm run lint

    # Dry-run the email reporting script.
    test-email:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
            - uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            - name: Install Dependencies
              run: npm ci
            - name: Start MongoDB
              uses: supercharge/mongodb-github-action@1.3.0
              with:
                  mongodb-version: 4.4
            - run: npx ts-node -P scripts/tsconfig.json scripts/email.ts
              env:
                  DEBUG: shootismoke:*
                  BACKEND_AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
                  BACKEND_MAILGUN_API_KEY: ${{ secrets.STAGING_BACKEND_MAILGUN_API_KEY }}
                  BACKEND_MAILGUN_DOMAIN: ${{ secrets.STAGING_BACKEND_MAILGUN_DOMAIN }}
                  BACKEND_MONGODB_ATLAS_URI: mongodb://localhost/shootismoke

    # Dry-run the expo reporting script.
    test-expo:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
            - uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            - name: Install Dependencies
              run: npm ci
            - name: Start MongoDB
              uses: supercharge/mongodb-github-action@1.3.0
              with:
                  mongodb-version: 4.4
            - run: npx ts-node -P scripts/tsconfig.json scripts/expo.ts
              env:
                  DEBUG: shootismoke:*
                  BACKEND_AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
                  BACKEND_MONGODB_ATLAS_URI: mongodb://localhost/shootismoke

    test-unit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
            - uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            - name: Install Dependencies
              run: npm ci
            - name: Run unit test
              run: npm run test:unit

    test-coverage:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
            - uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            - name: Start MongoDB
              uses: supercharge/mongodb-github-action@1.3.0
              with:
                  mongodb-version: 4.4
            - name: Install Dependencies
              run: npm ci
            - name: Run server, test and generate coverage report
              run: |
                  cp .env.example .env
                  npm run dev &
                  sleep 10
                  npm test -- --coverage
