name: e2e

# End-to-end checks remain opt-in after a production deployment. Run this by
# hand from the Actions tab when a release needs browser-level verification.
on:
    workflow_dispatch:

jobs:
    cypress:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Run Cypress
              uses: cypress-io/github-action@v6
              env:
                  CYPRESS_BASE_URL: https://shootismoke.app

            # after the test run completes
            # store videos and any screenshots
            # NOTE: screenshots will be generated only if E2E test failed
            # thus we store screenshots only on failures
            # Alternative: create and commit an empty cypress/screenshots folder
            # to always have something to upload
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: cypress-screenshots
                  path: test/cypress/screenshots
            # Test run video was always captured, so this action uses "always()" condition
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: cypress-videos
                  path: test/cypress/videos

            - name: Cypress tests passed
              if: ${{ success() }}
              run: |
                  curl --request POST \
                  --url https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
                  --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' \
                  --header 'content-type: application/json' \
                  --data '{
                  "context": "cypress",
                  "state": "success",
                  "description": "Cypress tests passed",
                  "target_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }'

            - name: Cypress tests fail
              if: ${{ failure() }}
              run: |
                  curl --request POST \
                  --url https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
                  --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' \
                  --header 'content-type: application/json' \
                  --data '{
                  "context": "cypress",
                  "state": "failure",
                  "description": "Cypress tests failed",
                  "target_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }'
