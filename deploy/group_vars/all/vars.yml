---
# Non-secret configuration. Secrets live in vault.yml (encrypted).

repo_url: https://github.com/shootismoke/webapp.git
node_major: 22

domain_production: shootismoke.app
domain_staging: staging.shootismoke.app

# --- Production -------------------------------------------------------------
# Built in CI from a prod-v* tag and pushed here; deploy/push-build.sh does the
# same from a laptop.
prod_user: shootismoke
prod_home: /srv/shootismoke/production
prod_dir: /srv/shootismoke/production/webapp
prod_port: 3000

# --- Staging ----------------------------------------------------------------
# `next start` over a build CI made from the latest master commit, shipped here
# by deploy/stage.sh. Ansible creates the checkout once and then never touches
# it again; the deployment owns it, and resets it hard on every push.
staging_user: shootismoke-staging
staging_home: /srv/shootismoke/staging
staging_dir: /srv/shootismoke/staging/webapp
staging_port: 3001
staging_branch: master

# --- Box ---------------------------------------------------------------------
swap_size_mb: 2048

# A VSCode remote server watches a lot of files. Ubuntu's default (8192 on
# older releases) is not enough and fails with ENOSPC.
inotify_max_user_watches: 524288

# Memory ceilings, so staging can never take production down with it. The box
# has 4 GB; these leave headroom for npm ci during a release. Staging used to
# get more than double production's, because a dev server holds far more than
# `next start` does. It runs the same server now, so it gets the same ceiling.
prod_memory_high: 700M
prod_memory_max: 1G
staging_memory_high: 700M
staging_memory_max: 1G

# --- TLS ---------------------------------------------------------------------
# Two ways to terminate TLS, and which one is correct depends entirely on
# whether the domain is proxied by Cloudflare:
#
#   letsencrypt  DNS points straight at this box (currently Porkbun A records).
#                Caddy solves HTTP-01 itself and renews on its own. Requires
#                ports 80 and 443 reachable from the internet.
#   origin_ca    DNS is proxied by Cloudflare on Full (strict). HTTP-01 can
#                never work then -- the challenge stops at the edge -- so the
#                Cloudflare Origin CA cert below is placed by hand instead.
#                See deploy/README.md.
#
# Switching is this one line plus the DNS change; nothing else here cares.
caddy_tls_mode: letsencrypt

caddy_cert_dir: /etc/caddy/certs
caddy_cert: /etc/caddy/certs/origin.pem
caddy_key: /etc/caddy/certs/origin.key

