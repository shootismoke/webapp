# Runs shootismoke.app on a single host: the Next server behind Caddy, with
# Cloudflare proxying in front of Caddy.
#
#   docker compose up -d
#
# Expects a `.env` next to this file holding the BACKEND_* values (see
# .env.example). NEXT_PUBLIC_* values are baked into the image at build time and
# are not read here.

services:
  app:
    image: ghcr.io/shootismoke/webapp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    volumes:
      # ISR writes regenerated pages here; without this every restart throws
      # away the cache and the first hit on each city page pays full price.
      - isr-cache:/app/.next/cache
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Cloudflare Origin CA certificate and key. See DEPLOY.md.
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  isr-cache:
  caddy-data:
  caddy-config:
